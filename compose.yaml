services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: income
      POSTGRES_USER: income
      POSTGRES_PASSWORD: income_local
    ports: ['127.0.0.1:5432:5432']
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ['CMD-SHELL','pg_isready -U income -d income']
      interval: 5s
      timeout: 5s
      retries: 20
  etl:
    build: .
    environment:
      DATABASE_URL: postgresql://income:income_local@db:5432/income
      CENSUS_API_KEY: ${CENSUS_API_KEY:-}
      BEA_API_KEY: ${BEA_API_KEY:-}
    depends_on:
      db: {condition: service_healthy}
    command: ['python','-m','income.load']
    profiles: ['jobs']
  dashboard:
    build: .
    environment:
      DATABASE_URL: postgresql://income:income_local@db:5432/income
    depends_on:
      db: {condition: service_healthy}
    ports: ['8501:8501']
    command: ['streamlit','run','dashboard.py','--server.address=0.0.0.0']
  airflow:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__CORE__DAGS_FOLDER: /app/dags
      AIRFLOW__WEBSERVER__SECRET_KEY: local-development-only
      DATABASE_URL: postgresql://income:income_local@db:5432/income
      CENSUS_API_KEY: ${CENSUS_API_KEY:-}
      BEA_API_KEY: ${BEA_API_KEY:-}
      PYTHONPATH: /app
    depends_on:
      db: {condition: service_healthy}
    ports: ['127.0.0.1:8080:8080']
    command: standalone
    profiles: ['orchestration']
    volumes: ['airflowdata:/opt/airflow']
volumes:
  pgdata:
  airflowdata:
